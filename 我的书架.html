<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#407bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的书架">
<meta name="format-detection" content="telephone=no">
<!-- 苹果主屏幕图标 -->
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 180 180%22><rect width=%22180%22 height=%22180%22 rx=%2240%22 fill=%22%23407bff%22/><text x=%2290%22 y=%22115%22 font-size=%2280%22 text-anchor=%22middle%22>📖</text></svg>">
<title>我的书架</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-tap-highlight-color: transparent;}
body{
  max-width:100%;
  margin:0;
  padding:12px 16px calc(20px + env(safe-area-inset-bottom));
  padding-top:calc(12px + env(safe-area-inset-top));
  background:#f7f8fa;
  color:#222;
  min-height:100vh;
}
h1{text-align:center;margin-bottom:16px;font-size:22px;font-weight:700}
.search-box{margin-bottom:14px}
#searchInput{
  width:100%;
  padding:12px 16px;
  font-size:16px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  outline:none;
}
#searchInput:focus{border-color:#407bff}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{
  flex:1;
  padding:10px 0;
  border-radius:8px;
  border:none;
  background:#e4e7ed;
  cursor:pointer;
  font-size:15px;
  transition:all .2s;
}
.tab.active{background:#407bff;color:#fff;font-weight:500}
.tag-filter-area{margin-bottom:14px;line-height:2}
.tag-chip{
  display:inline-block;
  padding:5px 12px;
  background:#ddeaff;
  border-radius:14px;
  margin:0 6px 6px 0;
  cursor:pointer;
  font-size:13px;
}
.tag-chip.active{background:#407bff;color:white}
.add-area{
  background:#fff;
  padding:16px;
  border-radius:12px;
  margin-bottom:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.add-area h3{margin-bottom:12px;font-size:17px}
.input-row{display:flex;flex-direction:column;gap:10px}
.add-area input{
  width:100%;
  padding:11px 12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
  outline:none;
}
.add-area input:focus{border-color:#407bff}
#addBtn{
  padding:12px;
  background:#27ae60;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  font-weight:500;
}
.book-list{
  background:#fff;
  padding:8px 16px;
  border-radius:12px;
  min-height:200px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.book-item{
  padding:14px 0;
  border-bottom:1px solid #f0f0f0;
}
.book-item:last-child{border-bottom:none}
.book-info{line-height:1.5}
.book-name{font-weight:600;font-size:16px}
.book-author{color:#666;font-size:14px;margin-top:2px}
.book-tags{margin-top:6px}
.book-tag{
  display:inline-block;
  background:#f0f4ff;
  color:#407bff;
  padding:3px 8px;
  border-radius:8px;
  font-size:12px;
  margin-right:4px;
}
.btns{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.btns button{
  flex:1;
  padding:8px;
  font-size:14px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}
.btn-read{background:#e8f0ff;color:#407bff}
.btn-read.read{background:#fff0e8;color:#e67e22}
.btn-del{background:#ffeaea;color:#e74c3c}
.empty{color:#999;text-align:center;padding:40px 0;font-size:15px}
</style>
</head>
<body>
<h1>📖 我的书架</h1>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 搜索书名 / 作者 / 标签" oninput="render()">
</div>

<div class="tabs">
<button class="tab active" data-type="all" onclick="switchTab('all')">全部</button>
<button class="tab" data-type="unread" onclick="switchTab('unread')">未读</button>
<button class="tab" data-type="read" onclick="switchTab('read')">已读</button>
</div>

<div class="tag-filter-area" id="tagFilterArea"></div>

<div class="add-area">
<h3>➕ 添加新书</h3>
<div class="input-row">
<input id="bookName" placeholder="书名（必填）">
<input id="bookAuthor" placeholder="作者">
<input id="bookTags" placeholder="标签，逗号分隔，例：文学,小说">
<button id="addBtn" onclick="addBook()">添加到书架</button>
</div>
</div>

<div class="book-list" id="bookList"></div>

<script>
let books = JSON.parse(localStorage.getItem("myBookshelf")) || [];
let currentTab = "all";
let selectedTag = null;

function switchTab(type){
    currentTab = type;
    document.querySelectorAll(".tab").forEach(t=>{
        t.classList.remove("active");
        if(t.dataset.type === type) t.classList.add("active");
    })
    render();
}

function addBook(){
    const name = document.getElementById("bookName").value.trim();
    const author = document.getElementById("bookAuthor").value.trim();
    const tagStr = document.getElementById("bookTags").value.trim();
    if(!name){
        alert("书名不能为空");
        return;
    }
    const tags = tagStr.split(',').map(t=>t.trim()).filter(t=>t);
    books.push({id:Date.now(), name, author, tags, isRead:false});
    saveData();
    document.getElementById("bookName").value = "";
    document.getElementById("bookAuthor").value = "";
    document.getElementById("bookTags").value = "";
    render();
}

function saveData(){
    localStorage.setItem("myBookshelf", JSON.stringify(books));
}

function toggleRead(id){
    const item = books.find(b=>b.id === id);
    if(item){
        item.isRead = !item.isRead;
        saveData();
        render();
    }
}

function delBook(id){
    if(confirm("确定删除这本书？")){
        books = books.filter(b=>b.id !== id);
        saveData();
        render();
    }
}

function getAllTags(){
    const s = new Set();
    books.forEach(b=>b.tags.forEach(t=>s.add(t)));
    return [...s];
}

function selectTag(tag){
    selectedTag = (selectedTag === tag) ? null : tag;
    render();
}

function render(){
    const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
    let list = [...books];

    if(keyword){
        list = list.filter(b=>
            b.name.toLowerCase().includes(keyword) ||
            b.author.toLowerCase().includes(keyword) ||
            b.tags.some(t=>t.toLowerCase().includes(keyword))
        );
    }
    if(currentTab === "unread") list = list.filter(b=>!b.isRead);
    if(currentTab === "read") list = list.filter(b=>b.isRead);
    if(selectedTag) list = list.filter(b=>b.tags.includes(selectedTag));

    const allTags = getAllTags();
    let tagHtml = "";
    tagHtml += `<span class="tag-chip ${selectedTag===null?'active':''}" onclick="selectTag(null)">全部标签</span>`;
    allTags.forEach(tag=>{
        tagHtml += `<span class="tag-chip ${selectedTag===tag?'active':''}" onclick="selectTag('${tag}')">${tag}</span>`;
    })
    document.getElementById("tagFilterArea").innerHTML = tagHtml;

    const container = document.getElementById("bookList");
    if(list.length === 0){
        container.innerHTML = `<div class="empty">书架空空如也，添加第一本书吧</div>`;
        return;
    }

    let html = "";
    list.forEach(book=>{
        let tags = "";
        book.tags.forEach(t=>{ tags += `<span class="book-tag">${t}</span>`; })
        html += `
        <div class="book-item">
            <div class="book-info">
                <div class="book-name">${book.name}</div>
                <div class="book-author">作者：${book.author || "未填写"}</div>
                <div class="book-tags">${tags}</div>
            </div>
            <div class="btns">
                <button class="btn-read ${book.isRead?'read':''}" onclick="toggleRead(${book.id})">${book.isRead ? "✓ 已读 · 点设未读" : "标记为已读"}</button>
                <button class="btn-del" onclick="delBook(${book.id})">删除</button>
            </div>
        </div>`;
    })
    container.innerHTML = html;
}

render();
</script>
</body>
</html>
